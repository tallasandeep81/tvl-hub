<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12307A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TVL Hub">
<title>TVL Systems Hub</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#12307A;font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#fff}
  .splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px}
  .splash img{width:96px;height:96px;border-radius:22px;background:#fff}
  .splash b{font-size:20px}
  .splash small{opacity:.75;font-size:13px}
  .bar{width:140px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:#fff;border-radius:4px;animation:m 1.1s ease-in-out infinite}
  @keyframes m{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  .btn{display:none;background:#fff;color:#12307A;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:12px}
  @media (prefers-reduced-motion:reduce){.bar i{animation:none}}
</style>
</head>
<body>
<div class="splash">
  <img src="icon-192.png" alt="TVL">
  <div><b>TVL Systems Hub</b><br><small>When Safety Matters</small></div>
  <div class="bar" id="bar"><i></i></div>
  <a class="btn" id="btn" href="#">Open hub</a>
</div>

<script>
  // ▼ Your Apps Script web app URL (ends with /exec)
  const HUB_URL = 'https://script.google.com/macros/s/AKfycbwTNepo8fsmBxgW0ozV3lo951BIaYXt_T6s6973oz-l0lUTskfzwto-l-WSTB8nf11iTQ/exec';

  // Open the hub directly (Google sign-in does not work inside an embedded frame)
  const btn = document.getElementById('btn');
  btn.href = HUB_URL;
  setTimeout(() => location.replace(HUB_URL), 600);

  // If the user comes back to this screen, show a button instead of looping
  window.addEventListener('pageshow', e => {
    if (e.persisted) { document.getElementById('bar').style.display = 'none'; btn.style.display = 'inline-block'; }
  });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
